<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>NumericInput</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<style>html,body{margin:0;background:var(--bg0);} .pad{padding:18px;} </style>
</head>
<body class="ab">
<div class="pad" style="max-width:520px"><div class="ab-pane"><div class="ab-pane-body">
<div class="ab-fr"><label>QS 100% Limit</label><div class="ab-affix"><input id="lim" class="ab-in ab-num" value="10,000,000"><span>USD</span></div></div>
<div class="ab-fr"><label>Retention %</label><div class="ab-affix"><input id="ret" class="ab-in ab-num" value="30"><span>%</span></div></div>
<div class="ab-fr"><label>Retention Amount</label><div class="ab-affix"><input id="amt" class="ab-in ab-num is-derived" readonly tabindex="-1"><span>USD</span></div></div>
</div></div></div>
<script>
function n(v){return Number(String(v).replace(/[^0-9.\-]/g,''))||0}
function fmt(v){return Math.round(v).toLocaleString('en-US')}
var lim=document.getElementById('lim'),ret=document.getElementById('ret'),amt=document.getElementById('amt');
function calc(){amt.value=fmt(n(lim.value)*Math.min(100,Math.max(0,n(ret.value)))/100)}
lim.addEventListener('input',function(){var c=n(lim.value);lim.value=c?fmt(Math.trunc(c)):'';calc()});
ret.addEventListener('input',calc);ret.addEventListener('blur',function(){ret.value=Math.min(100,Math.max(0,n(ret.value)))});calc();
</script>
</body>
</html>
