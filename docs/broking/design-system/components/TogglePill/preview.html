<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TogglePill</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<style>html,body{margin:0;background:var(--bg0);} .pad{padding:18px;} </style>
</head>
<body class="ab">
<div class="pad" style="display:flex;gap:18px;flex-wrap:wrap;align-items:center">
<span class="ab-toggle t"><button class="is-on">Fixed commission</button><button>Sliding scale</button></span>
<span class="ab-toggle t"><button>Yes</button><button class="is-on">No</button></span>
<span class="ab-toggle t"><button class="is-on">Proportional</button><button>Non-proportional</button></span>
</div>
<script>
document.querySelectorAll('.t').forEach(function(g){g.querySelectorAll('button').forEach(function(b){b.onclick=function(){g.querySelectorAll('button').forEach(function(x){x.classList.toggle('is-on',x===b)})}})});
</script>
</body>
</html>
