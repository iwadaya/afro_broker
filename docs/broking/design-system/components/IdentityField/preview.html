<!-- @dsCard group="Identity" height=330 subtitle="UMR + business type — step 1" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>IdentityField</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<style>html,body{margin:0;background:var(--bg0);} .pad{padding:18px;} </style>
</head>
<body class="ab">
<div class="pad" style="max-width:560px">
<div class="ab-pane">
 <div class="ab-pane-head"><span class="ab-pane-title">Identify contract</span><span class="ab-tag">Step 1</span></div>
 <div class="ab-pane-body">
  <div class="ab-fr"><label for="umr">UMR<span class="ab-req">*</span></label>
   <div><input id="umr" class="ab-in ab-umr-input" value="B0621" maxlength="17" autocomplete="off" spellcheck="false">
   <div id="st" class="ab-umr-status is-idle">B + 4-digit broker no. + up to 12 characters</div></div></div>
  <div class="ab-fr"><label>Business type<span class="ab-req">*</span></label>
   <div><span class="ab-toggle" id="bt"><button class="is-on">Proportional</button><button>Non-proportional</button></span></div></div>
  <div class="ab-fr"><label for="ren">Renewal of</label><input id="ren" class="ab-in" placeholder="Search prior UMR or cedant…"></div>
  <div class="ab-fr"><label>Contract ID</label><span class="ab-uuid" id="uuid">Assigned on create</span></div>
  <div style="display:flex;justify-content:flex-end;margin-top:6px"><button id="go" class="ab-btn primary" disabled>Create contract</button></div>
 </div>
</div></div>
<script>
var taken={"B0621DAR26TR001":"Kenya Re · QS 2026"};
var inp=document.getElementById('umr'),st=document.getElementById('st'),go=document.getElementById('go');
var RX=/^B[0-9]{4}[A-Z0-9]{1,12}$/;
function set(c,t){st.className='ab-umr-status '+c;st.textContent=t;}
function check(final){var v=inp.value.toUpperCase().replace(/\s+/g,'');if(inp.value!==v)inp.value=v;inp.classList.remove('is-error');go.disabled=true;
 if(v.length<=5){set('is-idle','B + 4-digit broker no. + up to 12 characters');return;}
 if(!RX.test(v)){inp.classList.add('is-error');set('is-bad','Format: B + 4 digits + 1–12 letters or digits (max 17).');return;}
 if(!final){set('is-idle','Format OK — checking on leave');return;}
 if(taken[v]){inp.classList.add('is-error');set('is-bad','UMR '+v+' is already used by '+taken[v]+' — open it or change the reference.');return;}
 set('is-ok','\u2713 '+v+' is available');go.disabled=false;}
inp.addEventListener('input',function(){check(false)});inp.addEventListener('blur',function(){check(true)});
document.querySelectorAll('#bt button').forEach(function(b){b.onclick=function(){document.querySelectorAll('#bt button').forEach(function(x){x.classList.toggle('is-on',x===b)})}});
go.onclick=function(){document.getElementById('uuid').textContent='3f2b9c1e-7a44-4c0e-9d1a-5b8e2f6c0a17';go.textContent='Created';go.disabled=true;};
</script>
</body>
</html>
